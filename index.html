<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon Quiz</title>

    <link rel="stylesheet" href='revert.css'>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥓</text></svg>">

</head>
<body>

    <div class = 'mainItems'>

        <div id = 'space' class = 'border' style="opacity: 0;">

            <h2 id = 'title' class = 'baconFontText'>Bacon Chat</h2>

        </div>

        <form id = 'baconForm' class="centre vCentre">

            <fieldset class="border centre" id ='baconField'>

                <legend>Do you like bacon?</legend>

                <div class="option">

                    <input type ="radio" id ='yesBacon' name='baconQuiz' checked></input>
                    <label for="yesBacon">Hell Yeah! 😎</label> 

                </div>

                <div class="option">

                    <input type ="radio" id ='noBacon' name="baconQuiz"></input>
                    <label for="noBacon">Hell no! 🤮🤢</label>

                </div>

                <div class="option">

                    <input type ="radio" id ='maybeBacon' name="baconQuiz"></input>
                    <label for="maybeBacon">I'm not opposed to the idea. 🚳</label>

                </div>

                <input type="text" id='username' placeholder="Name: " required>
                
                <input type ='submit' id='submit' value='My answer is the best answer!'></input>

            </fieldset>


        </form>

        <div id ='overallOpinion' class="border centre">

            <h2 class="baconFontText">General Bacon Opinion Is:</h2>

            <h1 id = 'opinion' class="baconFontText"></h1>

        </div>

    </div>

        <a href="chat.html" id="link">CHAT ABOUT BACON</a>

    <script type="module" src="app.js"></script>
    
</body>
</html>
