<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>

    <link rel="stylesheet" href='revert.css'>
</head>
<body>

    <button id="back"><a href="index.html">🥓</a></button>

    <div id="register" class="vCentre centre">

        <form id="registerForm">

            <legend>Register to use BaconChat</legend>

            <label for="email">Email Address:</label>
            <input type="email" id="email" required placeholder="E-mail"><br>
            <label for="usernameRegister">Username:</label>
            <input type="text" id ="usernameRegister" required placeholder="Enter your username"> <br>

            <input type="submit" value="Submit" id="submit">

            <h2 id="check" style="display: none;">chekc you emails</h2>

        </form>

    </div>

    <div id = 'baconChat' class = 'border'>

        <h2 id = 'title' class = 'baconFontText'>Bacon Chat</h2>

    </div>

    <div class = 'baconChatWrapper'>

        <form id="baconChatForm">



            <label for="upload" id="label">🖼️</label>
            
            <input type="file" id="upload" accept="image/png, image/jpeg, image/webp">
            <input type = 'text' id="baconChatInput" placeholder="What do you have to say about bacon?">
            <!--<input type = 'submit' id ='baconChatSubmit' value="Say">-->
            <!--<input type = 'text' id="username" placeholder="Name">-->

        </form>

    </div>

    <script type="module" src="chat.js"></script>
    
</body>
</html>
